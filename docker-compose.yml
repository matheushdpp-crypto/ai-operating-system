services:
  # ============================================================================
  # 1. PostgreSQL with pgvector (Primary State & Semantic Vector Store)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aios-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-aios_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-aios_secure_password_change_me}
      POSTGRES_DB: ${DATABASE_NAME:-aios_platform}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-aios_admin} -d ${DATABASE_NAME:-aios_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aios-network

  # ============================================================================
  # 2. n8n (Workflow & Integration Engine)
  # ============================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: aios-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/webhook}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-n8n_encryption_secret_key_change_me}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DATABASE_NAME:-aios_platform}
      - DB_POSTGRESDB_USER=${DATABASE_USER:-aios_admin}
      - DB_POSTGRESDB_PASSWORD=${DATABASE_PASSWORD:-aios_secure_password_change_me}
      - DB_POSTGRESDB_SCHEMA=n8n
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aios-network

  # ============================================================================
  # 3. MinIO (S3-Compatible Object Storage for Documents & Artifacts)
  # ============================================================================
  storage:
    image: minio/minio:latest
    container_name: aios-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin_secure_key}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aios-network

  # ============================================================================
  # 4. AiOS Core API
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aios-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - API_HOST=0.0.0.0
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER:-aios_admin}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-aios_secure_password_change_me}
      - DATABASE_NAME=${DATABASE_NAME:-aios_platform}
      - N8N_BASE_URL=http://n8n:5678
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
      - STORAGE_ENDPOINT=storage
      - STORAGE_PORT=9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin_secure_key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-aios_jwt_super_secret_signing_key_replace_in_production}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aios-network

  # ============================================================================
  # 5. AiOS Control Center (Frontend UI)
  # ============================================================================
  control-center:
    build:
      context: .
      dockerfile: apps/control-center/Dockerfile
    container_name: aios-control-center
    restart: unless-stopped
    ports:
      - "${CONTROL_CENTER_PORT:-8080}:80"
    environment:
      - API_BASE_URL=http://localhost:${API_PORT:-3000}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aios-network

networks:
  aios-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
  storage_data:
    driver: local
